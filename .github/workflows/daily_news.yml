name: Daily Financial News AI Agent

on:
  schedule:
    # 主排程：每天台灣時間 08:17 (UTC 00:17) 自動執行
    - cron: '17 0 * * *'
    # 備援排程：每天台灣時間 09:42 (UTC 01:42) 補跑（防止 GitHub 尖峰丟包）
    - cron: '42 1 * * *'
  workflow_dispatch:
    inputs:
      send_line:
        description: '是否同時推播至 LINE 群組'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝依賴套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 判斷今日是否為每 3 天的 LINE 推播日
        id: line_check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.send_line }}" = "true" ]; then
              echo "should_send=true" >> $GITHUB_OUTPUT
            else
              echo "should_send=false" >> $GITHUB_OUTPUT
            fi
          else
            DAY=$(date +%-d)
            if [ $(( DAY % 3 )) -eq 1 ]; then
              echo "今日 ($DAY 號) 符合每 3 日推播週期，啟動 LINE 發布！"
              echo "should_send=true" >> $GITHUB_OUTPUT
            else
              echo "今日 ($DAY 號) 為日常網站更新日，略過 LINE 推播以保護額度。"
              echo "should_send=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: 執行 AI 財經新聞抓取、摘要與發布
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          ENABLE_LINE_PUSH: ${{ steps.line_check.outputs.should_send }}
        run: |
          python main.py

      - name: 提交更新後的 index.html 到倉庫
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update daily financial digest $(date +'%Y-%m-%d %H:%M')" && git push)

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v4

      - name: 上傳網頁 Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
