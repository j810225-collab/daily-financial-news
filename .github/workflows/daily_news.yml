name: Daily Financial News AI Agent

on:
  schedule:
    # 每 3 天台灣時間 08:00 (UTC 00:00) 自動執行
    - cron: '0 0 */3 * *'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊立即執行

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝依賴套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行 AI 財經新聞抓取、摘要與推播
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
        run: |
          python main.py

      - name: 提交更新後的 index.html 到倉庫
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update daily financial digest [skip ci]" && git push)

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v4

      - name: 上傳網頁 Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
