name: Daily Financial News AI Agent

on:
  schedule:
    # 主排程：每天台灣時間 08:17 (UTC 00:17) 自動執行
    - cron: '17 0 * * *'
    # 備援排程：每天台灣時間 09:42 (UTC 01:42) 自動補跑
    - cron: '42 1 * * *'
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'src/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      send_line:
        description: '是否同時推播至 LINE 群組'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝依賴套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 判斷執行模式與 LINE 推播開關
        id: line_check
        run: |
          # 如果是 push 事件，僅部署網頁，不推播 LINE (保護額度)
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "偵測到代碼/網頁提交 (push)，執行內容生成與 Pages 部署，略過 LINE 推播。"
            echo "should_send=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.send_line }}" = "true" ]; then
              echo "should_send=true" >> $GITHUB_OUTPUT
            else
              echo "should_send=false" >> $GITHUB_OUTPUT
            fi
          else
            # 定時排程: 每 3 天一次 (例如 1, 4, 7, 10, 13, 16, 19, 22, 25, 28, 31 號)
            DAY=$(date +%-d)
            if [ $(( DAY % 3 )) -eq 1 ]; then
              echo "今日 ($DAY 號) 符合每 3 日推播週期，啟動 LINE 發布！"
              echo "should_send=true" >> $GITHUB_OUTPUT
            else
              echo "今日 ($DAY 號) 為日常網站更新日，略過 LINE 推播以保護額度。"
              echo "should_send=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: 執行 AI 財經新聞抓取、摘要與發布
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          ENABLE_LINE_PUSH: ${{ steps.line_check.outputs.should_send }}
        run: |
          python main.py

      - name: 提交更新後的 index.html 到倉庫
        if: github.event_name != 'push'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update daily financial digest $(date +'%Y-%m-%d %H:%M')" && git push)

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v4

      - name: 上傳網頁 Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
